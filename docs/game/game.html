<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Квест</title>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <div class="card">
        <div class="muted" id="progressLine">Прогресс</div>
        <h1 id="title" style="margin-top:8px;">Загрузка…</h1>
        <div class="muted" id="question"></div>

        <div id="answers" class="answers"></div>

        <div id="toast" class="toast" style="display:block;"></div>

        <div class="row">
          <button class="btn secondary" id="hintBtn">Подсказка</button>
          <button class="btn secondary" id="resetBtn">Сбросить прогресс</button>
        </div>

        <div class="muted" id="hintText" style="margin-top:10px;"></div>
      </div>

      <div class="card">
        <h2 style="margin-bottom:8px;">🔑 Ключ</h2>
        <div class="muted">Собери 12 символов:</div>
        <div class="key" id="keyBox" style="margin-top:10px;">____________</div>
      </div>
    </div>
  </div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
