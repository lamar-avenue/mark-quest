<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Квест для Марка</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./game/style.css?v=400" />

<body>

  <header class="topbar">

  <div class="volume-pill">

    <!-- твой range -->

    <div class="bg__glow"></div>
  </div>

  <main class="shell">

  </main>

  <!-- IMPORTANT: data.js BEFORE app.js -->
  <script src="./game/data.js?v=400"></script>
